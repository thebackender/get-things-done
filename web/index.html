<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTD Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#list">GTD</a>
    <nav id="tabs">
      <a href="#list">List</a>
      <a href="#board">Sprint</a>
      <a href="#backlog">Backlog</a>
      <a href="#calendar">Calendar</a>
      <a href="#graph">Graph</a>
      <a href="#stats">Stats</a>
    </nav>
    <span class="spacer"></span>
    <button id="undo-btn" title="Undo last action (Ctrl+Z)" disabled>↶ Undo</button>
    <button id="add-task" class="primary" title="New task (N)">+ Task</button>
  </header>
  <main id="view"></main>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
